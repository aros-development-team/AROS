##begin config
basename HIDDCl
libbasetype struct IntHIDDClassBase
version 1.3
residentpri 92
classid CLID_Hidd
superclass CLID_Root
classptr_field hd_csd.hiddclass
classdatatype struct HIDDData
oopbase_field  hd_csd.cs_OOPBase
options noexpunge
##end config

##begin cdefprivate
#include "hiddclass_intern.h"
##end cdefprivate

##begin interface
##begin config
interfaceid I_Hidd
interfacename Hidd
methodstub    HIDD
methodbase    HiddBase
attributebase HiddAttrBase
##end config

##begin attributelist
UWORD  Type         # [..G] Major type of HIDD
UWORD  SubType      # [..G] Sub-type of HIDD
ULONG  Producer     # [I.G] Hardware manufacturer ID
STRPTR Name 	    # [I.G] Name of HIDD
STRPTR HardwareName # [I.G] Hardware description
STRPTR Active	    # [ISG] Current active status
ULONG  Status       # [..G] Status change
ULOMG  ErrorCode    # [..G] Error code
UBYTE  Locking      # [..G] Type of locking supported
ULONG  Product      # [I.G] Hardware product ID
STRPTR ProducerName # [I.G] Hardware manufacturer name
APTR   DriverData   # [I..] Driver-specific data
CONST_STRPTR DevicePath # [I.G] Canonical identity of the hardware the object represents
OOP_Object *Parent  # [I.G] The object this one belongs to
##end attributelist

##begin methodlist
BOOL AddRelation(ULONG type, OOP_Object *target, struct TagItem *tags)
BOOL RemoveRelation(ULONG type, OOP_Object *target, CONST_STRPTR path)
VOID EnumRelations(ULONG type, struct Hook *callback, APTR hookMsg)
OOP_Object *FindRelated(ULONG type, CONST_STRPTR classID)
OOP_Object *FindDevicePath(CONST_STRPTR path)
##end   methodlist
##end interface

##begin methodlist
.interface Root
New
Dispose
Set
Get
.interface Hidd
AddRelation
RemoveRelation
EnumRelations
FindRelated
FindDevicePath
##end methodlist

##begin interface
##begin config
interfaceid I_Hw
interfacename HW
methodstub    HW
methodbase    HWBase
attributebase HWAttrBase
##end config

##begin attributelist
BOOL            InUse     # [..G] Subsystem in use or not
CONST_STRPTR    ClassName # [I.G] Human-readable description of hardware type
OOP_Object      *Device   # [I.G] The Hardware Device Object (e.g. PCIDevice) the driver uses.
##end attributelist

##begin methodlist
OOP_Object *AddDriver(OOP_Class *driverClass, struct TagItem *tags)
BOOL RemoveDriver(OOP_Object *driverObject)
VOID EnumDrivers(struct Hook *callback, APTR hookMsg)
BOOL SetUpDriver(OOP_Object *driverObject)
void CleanUpDriver(OOP_Object *driverObject)
##end methodlist
##end interface

##begin class
##begin config
basename HW
type hidd
initpri 0
classid CLID_HW
superclass CLID_Hidd
classptr_field hd_csd.hwclass
classdatatype struct HWData
##end config

##begin methodlist
.interface Root
New
Get
.interface HW
AddDriver
RemoveDriver
EnumDrivers
SetUpDriver
CleanUpDriver
##end methodlist
##end class

##begin class
##begin config
basename HWRoot
type hidd
initpri -2
classid CLID_HW_Root
superclass CLID_HW
classptr_field hd_csd.rootclass
##end config

##begin methodlist
.interface Root
New
Dispose
.interface HW
RemoveDriver
##end methodlist
##end class
