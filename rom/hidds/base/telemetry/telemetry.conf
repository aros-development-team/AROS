##begin interface
##begin config
interfaceid   hidd.telemetry.thermal
interfacename Hidd_Thermal
methodstub    HIDD_Thermal
methodbase    HiddThermalBase
attributebase HiddThermalAB
##end config

##begin attributelist
ULONG Points # [I.G] vHidd_ThermalF() bits of the points the zone has
LONG Temperature # [..G] The sensor's reading, thousandths of a degree Celsius
##end attributelist

##begin methodlist
BOOL GetTemperature(ULONG point, LONG *temperature)
##end methodlist
##end interface

##begin interface
##begin config
interfaceid   hidd.telemetry.fan
interfacename Hidd_Fan
methodstub    HIDD_Fan
methodbase    HiddFanBase
attributebase HiddFanAB
##end config

##begin attributelist
ULONG Values # [I.G] vHidd_FanF() bits of the values the fan reports
ULONG Writable # [I.G] vHidd_FanF() bits of the values that can be set
##end attributelist

##begin methodlist
BOOL GetValue(ULONG which, LONG *value, LONG *min, LONG *max)
BOOL SetValue(ULONG which, LONG value)
##end methodlist
