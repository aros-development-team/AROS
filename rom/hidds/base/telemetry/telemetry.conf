##begin config
basename Telemetry
libbasetype struct HiddTelemetryIntBase
version 50.4
residentpri 90
classid CLID_Hidd_Telemetry
superclass CLID_Hidd
classptr_field hbi_csd.telemetryClass
classdatatype struct HIDDTelemetryData
oopbase_field  hbi_csd.cs_OOPBase
seglist_field  hbi_csd.cs_SegList
options noexpunge
##end config

##begin cdefprivate
#include "telemetry_intern.h"
##end cdefprivate

##begin interface
##begin config
interfaceid   hidd.telemetry
interfacename Hidd_Telemetry
methodstub    HIDD_Telemetry
methodbase    HiddTelemetryBase
attributebase HiddTelemetryAB
##end config

##begin attributelist
ULONG EntryCount # [..G]
##end attributelist

##begin methodlist
BOOL GetEntryAttribs(ULONG index, struct TagItem *tags)
BOOL SetEntryValue(ULONG index, LONG value)
##end methodlist
##end interface

##begin methodlist
.interface Root
New
Dispose
Get
Set
.interface Hidd_Telemetry
GetEntryAttribs
SetEntryValue
##end methodlist


##begin class
##begin config
basename Thermal
type hidd
initpri -1
classid CLID_Hidd_Thermal
superclass CLID_Hidd_Telemetry
classptr_field hbi_csd.thermalClass
classdatatype struct HIDDThermalData
##end config

##begin methodlist
.interface Root
New
Get
.interface Hidd_Telemetry
GetEntryAttribs
.interface Hidd_Thermal
GetTemperature
##end methodlist
##end class

##begin class
##begin config
basename Fan
type hidd
initpri -1
classid CLID_Hidd_Fan
