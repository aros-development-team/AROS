##begin config
version 41.10
basename con
residentpri -124
handler_func CONMain
##end config

##begin handler
.priority 5
.startup 0
DosNode=CON
.startup 1
DosNode=RAW
# Findable by name, so a handler stub can hand its startup packet over. The
# startup is reset first because it carries over from the entry above, and a
# stub supplies its own anyway.
.startup 0
Resident=con-handler
##end handler

