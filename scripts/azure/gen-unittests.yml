# Update unittests.html, and its translated copies (<lang>/unittests.html),
# based on remote unit test files
# Requires secrets:
# - SF_RSYNC_USER
#
# NOTE: SourceForge has discontinued interactive/remote-command shell
# access (shell.sourceforge.net). Their file-management host
# (web.sourceforge.net) still supports SFTP/SCP/rsync-over-SSH, so this
# pipeline now does everything through rsync (file listing, download,
# upload) and never runs a remote command over ssh. All logic is
# inlined below so the pipeline has no dependency on scripts living
# elsewhere in the repo.

trigger:
- master

schedules:
- cron: "15 */6 * * *"    # Every 6 hours
  branches:
    include:
    - master
  always: true
  batch: false
  displayName: Every 6 hours

pool:
  vmImage: 'ubuntu-latest'

variables:
  PROJWEBDIR: '/home/project-web/arosdev/htdocs'
  REMOTE_UNITTETS_DIR: '/home/project-web/arosdev/htdocs/unittests'
  SF_HOST: 'web.sourceforge.net'

steps:

- template: templates/setup-sf-ssh.yml

- bash: |
    set -e

    echo "Fetch remote unittest file list (via rsync --list-only, no shell command)..."
    rsync --list-only -e "ssh -o StrictHostKeyChecking=yes" \
      "$(SF_RSYNC_USER)"@$(SF_HOST):"$(REMOTE_UNITTETS_DIR)"/ \
      | awk '$1 !~ /^d/ {print $NF}' \
      | grep -E -- '-[0-9]{8}-unittests\.html$' \
      | sort > unittest_file_list.txt

    echo "Found $(wc -l < unittest_file_list.txt) remote unittest files."

    echo "Fetch current unittests.html and its translations (<lang>/unittests.html)..."
    # The site is built once per language: the default language page lives
    # in the web root, every other language in <lang>/. All of them carry
    # the same placeholder content, so all of them have to be updated.
    mkdir -p pages
    rsync -r -m -e "ssh -o StrictHostKeyChecking=yes" \
      --include='/unittests.html' \
      --include='/*/' \
      --include='/*/unittests.html' \
      --exclude='*' \
      "$(SF_RSYNC_USER)"@$(SF_HOST):$(PROJWEBDIR)/ pages/

    find pages -name unittests.html | sort > unittest_page_list.txt
    echo "Found $(wc -l < unittest_page_list.txt) unittests.html page(s) to update:"
    cat unittest_page_list.txt
    if [ ! -s unittest_page_list.txt ]; then
      echo "No unittests.html pages found on the remote host." >&2
      exit 1
    fi

    echo "Run local unittest html update script..."
    cat > update_html.py <<'PYEOF'
    import argparse
    import re


    def main():
        parser = argparse.ArgumentParser(description="Update html pages with new unittest list")
        parser.add_argument('--filelist', required=True, help='Path to file containing unittest file list')
        parser.add_argument('--pagelist', required=True, help='Path to file listing the unittests.html pages to update')
        args = parser.parse_args()

        with open(args.filelist, 'r', encoding='utf-8') as f:
            results = [line.strip() for line in f if line.strip()]

        activepage = '/unittests/' + results[0] if results else ''

        options = '\n'.join(
            f'    <option value="{r}">{r[:-15]}</option>' for r in results
        )

        new_content = f'''
    <h1>Unit Test Results<br><img style="width: 238px; height: 2px;" alt="spacer" src="/images/sidespacer.png"></h1>

    <select name="unittests" id="unittests" onchange="show_unittests(this.value)">
    {options}
    </select>

    <object style="float:left;height:100%;" width="100%" height="95vh" id="displayedtest" data="{activepage}" type="text/html"></object>

    <script type="text/javascript">
      function show_unittests(unittest) {{
        document.getElementById("displayedtest").data = "/unittests/" + unittest;
      }}
    </script>
    '''

        with open(args.pagelist, 'r', encoding='utf-8') as f:
            pages = [line.strip() for line in f if line.strip()]

        pattern = re.compile(
            r'(<main>.*?<!-- before CONTENT -->)(.*?)(<!-- after CONTENT -->.*?</main>)',
            re.DOTALL | re.IGNORECASE
        )

        failed = []
        for page in pages:
            with open(page, 'r', encoding='utf-8') as f:
                html_text = f.read()

            updated_html, count = pattern.subn(
                lambda m: m.group(1) + '\n\n' + new_content + '\n\n' + m.group(3),
                html_text
            )
            if count != 1:
                print(f'ERROR: content markers not found in {page}')
                failed.append(page)
                continue

            with open(page, 'w', encoding='utf-8') as f:
                f.write(updated_html)
            print(f'Updated {page}')

        if failed:
            raise SystemExit(1)


    if __name__ == '__main__':
        main()
    PYEOF

    # A page that could not be updated is left as it was fetched, so the
    # upload below is still safe; report the failure once it is done.
    update_rc=0
    python3 update_html.py --filelist unittest_file_list.txt --pagelist unittest_page_list.txt || update_rc=$?

    echo "Upload updated unittests.html pages back to remote..."
    # pages/ mirrors the layout of the web root and holds nothing but the
    # unittests.html files, so a recursive copy puts each one back in place.
    rsync -r -e "ssh -o StrictHostKeyChecking=yes" pages/ \
      "$(SF_RSYNC_USER)"@$(SF_HOST):$(PROJWEBDIR)/

    exit $update_rc
  env:
    SF_RSYNC_USER: $(SF_RSYNC_USER)
  displayName: 'Fetch, Update and Upload Unittests.html'
