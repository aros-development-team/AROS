#
# AROS staged Build pipeline
#
# Staged re-implementation of scripts/azure/azure-pipelines.yml. Builds a single
# flavour defined by the pipeline variables, but splits the work across
# dependent stages running on fresh agents so that no single agent has to hold
# the toolchain build, the core build and contrib at once.
#
#   Sources    (parallel)  -> source + contrib-source tarballs
#   Toolchain  (parallel)  -> cross toolchain (CACHED across runs; LLVM is not
#                             rebuilt every night), published as an artifact
#   Core       (needs A)   -> core + boot/main distfiles, base package, base
#                             manifest, hosted unit tests
#   Contrib    (needs A,C) -> contrib built self-contained against the toolchain,
#                             packaged by diffing the Core base manifest
#
# The build SYSTEM is unchanged: a developer still builds all-in-one locally
# with ./configure && make && make contrib. See README.md.
#
# Required pipeline variables (set per-flavour, same as the original pipeline):
#    arosbuild.name, arosbuild.target, arosbuild.variant, arosbuild.package,
#    arosbuild.packagefmt, arosbuild.vmimage, SF_RSYNC_USER, SF_RSYNC_PASSWORD
# Optional:
#    arosbuild.nativetoolchain, arosbuild.toolchain.family, arosbuild.gcc.version,
#    arosbuild.llvm.version, arosbuild.rust.version (builds the Rust cross
#    compiler into the toolchain), arosbuild.bootpackage, arosbuild.bootpackagefmt,
#    arosbuild.withcontrib, arosbuild.withtoolchain, arosbuild.withunittests,
#    arosbuild.deploy, arosbuild.config.extra, arosbuild.log.parsetranslations
#

trigger:
- master

variables:
  AROSBUILDTOOLCHAINDIR: '$(AZBUILDPATH)/toolchain'   # Location toolchains are installed in
  AROSPORTSSRCSDIR:      '$(AZBUILDPATH)/portssources' # Location external sources are downloaded to.
  AROSBUILDSDIR:         '$(AZBUILDPATH)/builds'       # Location builds are done in
  AROSBUILDBINDIR:       '$(AZBUILDPATH)/binaires'     # Location built binaries are collected in
  AROSLOGSDIR:           '$(AZBUILDPATH)/logs'         # Location logs are stored in.
  AROSDISTFILESDIR:      '$(AZBUILDPATH)/distfiles'    # Location built binaries are copied to.
  AZBUILDPATH:           '$(Build.BinariesDirectory)'  # workspace path
  AROSBUILDDIR:          '$(AROSBUILDSDIR)/$(arosbuild.name)' # current builds directory
  AROSSRCDIR:            '$(system.defaultWorkingDirectory)'  # Path to the source code
  AROSCONTRIBSRCDIR:     '$(Agent.BuildDirectory)/s-contrib'  # Path to the contrib source code
  # Toolchain cache-key components. The arosbuild.* toolchain settings are
  # optional per-flavour variables; an undefined $(var) would be left as
  # literal text in the Cache@2 key, so coalesce them to stable defaults
  # here and use these in the key instead.
  AROSTOOLCHAINFAMILY:   $[ coalesce(variables['arosbuild.toolchain.family'], 'gnu') ]
  AROSTOOLCHAINGCCVER:   $[ coalesce(variables['arosbuild.gcc.version'], 'default') ]
  AROSTOOLCHAINLLVMVER:  $[ coalesce(variables['arosbuild.llvm.version'], 'default') ]
  AROSTOOLCHAINRUSTVER:  $[ coalesce(variables['arosbuild.rust.version'], 'none') ]
  # CMake 4 removed compatibility with cmake_minimum_required() below 3.5,
  # which the older LLVM releases (and some ports) still declare. This only
  # raises the policy floor for such projects; newer ones are unaffected.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

stages:
# =============================================================================
- stage: Sources
  dependsOn: []
  jobs:
  - job: sources
    timeoutInMinutes: 120
    pool:
      vmImage: '$(arosbuild.vmimage)'
    steps:
    - template: templates/steps-prepare-host.yml
    - template: templates/steps-workspace.yml
      parameters:
        cloneContrib: true
    - template: templates/steps-source-package.yml

# =============================================================================
- stage: Toolchain
  dependsOn: []
  jobs:
  - job: toolchain
    timeoutInMinutes: 360
    pool:
      vmImage: '$(arosbuild.vmimage)'
    steps:
    - template: templates/steps-prepare-host.yml
    - template: templates/steps-workspace.yml
    # Restore a previously-built toolchain so the heavy crosstools/LLVM build
    # only runs when its inputs actually change. The cache holds the toolchain
    # tarball (preserving filesystem permissions/attributes) in a temporary
    # location; on a hit it is extracted to the SAME absolute path it was
    # built at (the toolchain is not relocatable - see README) and the
    # tarball is removed again.
    # The Cache task's path must exist both when the task runs (restore)
    # and at its post-job save; nothing else creates it, and the task
    # fails with a tar error if it is missing.
    - script: mkdir -p '$(Agent.TempDirectory)/toolchain-cache'
      displayName: 'Prepare toolchain cache directory'
    # A cached toolchain only works on the kind of host it was built on, at
    # the path it was built at: it embeds absolute paths (collect-aros runs
    # the linker by its full path, GCC bakes its --prefix, LLVM's cmake
    # package files name its build tree) and its host binaries link against
    # the host's libraries. Both are read from the running agent and go into
    # the cache key, so a new image or work path rebuilds the toolchain
    # instead of restoring a broken one. ('ubuntu-latest' moved from 24.04 to
    # 26.04 in Nov 2026, changing the work path from /home/vsts to
    # /home/runner; the old key restored the 24.04 toolchains there and every
    # build failed.)
    - script: |
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          host="${ID}-${VERSION_ID}"
        else
          host="$(uname -s)-$(sw_vers -productVersion 2>/dev/null || uname -r)"
        fi
        echo "Toolchain host: ${host}, path: $(AZBUILDPATH)"
        echo "##vso[task.setvariable variable=AROSTOOLCHAINHOST]${host}"
      displayName: 'Identify toolchain host'
    - task: Cache@2
      inputs:
        # collect-aros is installed into the toolchain directory and travels
        # in the cached tarball, so a change to it has to miss the cache the
        # way a change under tools/crosstools does.
        key: 'aros-toolchain | "$(arosbuild.name)" | "$(AROSTOOLCHAINHOST)" | "$(AZBUILDPATH)" | "$(AROSTOOLCHAINFAMILY)" | "$(AROSTOOLCHAINGCCVER)" | "$(AROSTOOLCHAINLLVMVER)" | "$(AROSTOOLCHAINRUSTVER)" | tools/crosstools/** | tools/collect-aros/**'
        path: '$(Agent.TempDirectory)/toolchain-cache'
        cacheHitVar: TOOLCHAIN_RESTORED
      displayName: 'Restore cached toolchain'
    - script: |
        # The cached tarball keeps the name it was packaged with on the run
        # that built it (its AROSBUILDID/date differs from today's), so glob
        # for it rather than assuming a name.
        cd '$(Agent.TempDirectory)/toolchain-cache'
        tar xjf *-toolchain.tar.bz2 -C '$(AROSBUILDTOOLCHAINDIR)/..'
        rm -f *-toolchain.tar.bz2
      condition: eq( variables['TOOLCHAIN_RESTORED'], 'true' )
      displayName: 'Extract cached toolchain'
    - template: templates/steps-darwin-hosttoolchain.yml
    - template: templates/steps-toolchain.yml

# =============================================================================
- stage: Core
  dependsOn: Toolchain
  condition: succeeded()
  jobs:
  - job: core
    timeoutInMinutes: 360
    pool:
      vmImage: '$(arosbuild.vmimage)'
    steps:
    - template: templates/steps-prepare-host.yml
    - template: templates/steps-workspace.yml
    - template: templates/steps-darwin-hosttoolchain.yml
    - template: templates/steps-core.yml

# =============================================================================
- stage: Contrib
  dependsOn:
  - Toolchain
  - Core
  condition: and( succeeded(), eq( variables['arosbuild.withcontrib'], 'yes' ) )
  jobs:
  - job: contrib
    timeoutInMinutes: 360
    pool:
      vmImage: '$(arosbuild.vmimage)'
    steps:
    - template: templates/steps-prepare-host.yml
    - template: templates/steps-workspace.yml
      parameters:
        cloneContrib: true
    - template: templates/steps-darwin-hosttoolchain.yml
    - template: templates/steps-contrib.yml
