##begin config
basename        PCIRP1
libbasetype     struct pcirp1base
version         1.0
residentpri     70
classptr_field  psd.driverClass
superclass      CLID_Hidd_PCIDriver
options         noexpunge
##end config

##begin cdefprivate
#include <exec/libraries.h>
#include <oop/oop.h>
#include <hidd/pci.h>

#define RP1_XHCI_COUNT  2

struct pcirp1_staticdata
{
    OOP_Class          *driverClass;
    OOP_AttrBase        hiddAB;
    struct Library     *kernelBase;
    IPTR                dma_offset;
    /* One synthetic type 0 header per xHCI; vendor 0 = not present. */
    ULONG               cfg[RP1_XHCI_COUNT][16];
};

struct pcirp1base
{
    struct Library              lib;
    struct pcirp1_staticdata    psd;
};
##end cdefprivate

##begin methodlist
.interface Root
New
.interface Hidd_PCIDriver
ReadConfigByte
ReadConfigWord
ReadConfigLong
WriteConfigByte
WriteConfigWord
WriteConfigLong
MapPCI
CPUtoPCI
PCItoCPU
AllocPCIMem
FreePCIMem
##end methodlist
