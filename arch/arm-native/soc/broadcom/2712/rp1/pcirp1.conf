##begin config
basename        PCIRP1
libbasetype     struct pcirp1base
version         1.0
residentpri     70
classptr_field  psd.driverClass
superclass      CLID_Hidd_PCIDriver
options         noexpunge
##end config

##begin cdefprivate
#include <exec/libraries.h>
#include <oop/oop.h>
#include <hidd/pci.h>

#define RP1_XHCI_COUNT  2
#define RP1_ETH_DEV     RP1_XHCI_COUNT  /* 00:02.0, after the xHCIs */
#define RP1_DEV_COUNT   (RP1_XHCI_COUNT + 1)

struct pcirp1_staticdata
{
    OOP_Class          *driverClass;
    OOP_AttrBase        hiddAB;
    struct Library     *kernelBase;
    OOP_Object         *bridge;         /* the root complex RP1 sits behind */
    /* One synthetic type 0 header per device; vendor 0 = not present. */
    ULONG               cfg[RP1_DEV_COUNT][16];
    ULONG               barsize[RP1_DEV_COUNT];
};

struct pcirp1base
{
    struct Library              lib;
    struct pcirp1_staticdata    psd;
};
##end cdefprivate

##begin methodlist
.interface Root
New
.interface Hidd_PCIDriver
ReadConfigByte
ReadConfigWord
ReadConfigLong
WriteConfigByte
WriteConfigWord
WriteConfigLong
MapPCI
CPUtoPCI
PCItoCPU
AllocPCIMem
FreePCIMem
##end methodlist
