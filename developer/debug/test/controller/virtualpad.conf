##begin config
basename	VirtualPad
version		1.0
libbase		VirtualPadBase
libbasetype	struct virtualpadbase
classptr_field  vsd.vpadClass
classdatatype   struct VirtualPadData
classid         CLID_Hidd_VirtualPad
superclass      CLID_Hidd_Controller
oopbase_field   vsd.cs_OOPBase
sysbase_field   vsd.cs_SysBase
residentpri	40
options         noexpunge
##end config

##begin cdefprivate
#include <hidd/input.h>
#include <hidd/controller.h>
#include "virtualpad.h"
#include "virtualpad_intern.h"
##end cdefprivate

##begin interface
##begin config
interfaceid   hidd.input.controller.virtual
interfacename Hidd_VirtualPad
methodstub    HIDD_VirtualPad
methodbase    HiddVirtualPadBase
attributebase HiddVirtualPadAB
##end config

##begin attributelist
CONST_STRPTR Profile       # [I.G] Name of the simulated controller profile
CONST_STRPTR Description   # [..G] Profile description
##end attributelist

##begin methodlist
void Feed(UBYTE kind, UBYTE index, LONG value)
void FeedReport(struct pHidd_Controller_RawReport *report)
void FeedTouch(UBYTE pad, UBYTE finger, struct pHidd_Controller_Finger *state)
void FeedSensor(UBYTE sensor, LONG x, LONG y, LONG z)
void FeedPower(UBYTE state, BYTE percent)
void FeedConnected(BOOL connected)
ULONG GetOutputLog(struct VirtualPad_Output *buffer, ULONG max)
##end methodlist
##end interface

##begin methodlist
.interface Root
New
Dispose
Get
.interface Hidd_Controller
SetRumble
SetLED
SetPlayerIndex
SendEffect
SetSensorsEnabled
UploadEffect
PlayEffect
StopEffect
RemoveEffect
.interface Hidd_VirtualPad
Feed
FeedReport
FeedTouch
FeedSensor
FeedPower
FeedConnected
GetOutputLog
##end methodlist
