.interface Root
New
Dispose
Get
Set
.interface Hidd_Controller
GetReading
GetControlInfo
GetOutputInfo
GetBinding
GetLabel
GetPowerInfo
GetSensorData
GetTouchpadFinger
GetEvent
GetBindings
SetRumble
SetLED
SetPlayerIndex
SendEffect
SetSensorsEnabled
UploadEffect
UpdateEffect
PlayEffect
StopEffect
RemoveEffect
SetGain
SetAutocenter
PushValue
PushReport
PushTouch
PushSensor
PushPower
SetConnected
##end methodlist

##begin class
##begin config
