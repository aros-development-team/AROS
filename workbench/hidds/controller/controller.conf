##begin config
basename	Controller
version		51.0
libbase		ControllerBase
libbasetype	struct controllerbase
classptr_field  csd.controllerClass
classdatatype   struct ControllerInstData
classid         CLID_Hidd_Controller
superclass      CLID_Hidd_Input
oopbase_field   csd.cs_OOPBase
sysbase_field   csd.cs_SysBase
residentpri	45
options         noexpunge
##end config

##begin cdefprivate
#include <hidd/input.h>
#include <hidd/controller.h>
#include "controller_intern.h"
##end cdefprivate

##begin interface
##begin config
interfaceid   hidd.input.controller
interfacename Hidd_Controller
methodstub    HIDD_Controller
methodbase    HiddControllerBase
attributebase HiddControllerAB
##end config

##begin attributelist
UWORD        DeviceID       # [..G] Instance id, never reused while the system runs
UWORD        VendorID       # [I.G] USB/Bluetooth vendor id, 0 if unknown
UWORD        ProductID      # [I.G] USB/Bluetooth product id
UWORD        Version        # [I.G] Device/firmware version
CONST_STRPTR Manufacturer   # [I.G] Vendor string
CONST_STRPTR Serial         # [I.G] Serial number / Bluetooth address, may be NULL
UBYTE        Bus            # [I.G] vHidd_Controller_Bus_*
CONST_STRPTR Path           # [I.G] Driver defined topology string
APTR         GUID           # [I.G] 16 byte device class identifier (computed from bus, name, ids if not supplied)
UBYTE        Type           # [I.G] vHidd_Controller_Type_* archetype hint
UBYTE        Style          # [I.G] vHidd_Controller_Style_* label style
UBYTE        Family         # [I.G] vHidd_Controller_Family_* protocol family
UBYTE        Connection     # [I.G] vHidd_Controller_Conn_*
WORD         PlayerIndex    # [.SG] Player index, -1 none
WORD         LegacyPort     # [..G] lowlevel.library joyport 0..3, or -1 when not mapped
BOOL         Connected      # [..G] FALSE between DeviceRemoved and disposal
APTR         ControlTable   # [I..] struct Hidd_Controller_ControlDesc array, Ctl_End terminated
APTR         OutputTable    # [I..] struct Hidd_Controller_OutputDesc array, Out_End terminated
APTR         BindingTable   # [I..] struct Hidd_Controller_Binding array giving the standard layout, Std_None terminated
UWORD        ButtonCount    # [..G]
UWORD        AxisCount      # [..G]
UWORD        HatCount       # [..G]
UWORD        TouchpadCount  # [..G]
UWORD        SensorCount    # [..G]
UWORD        OutputCount    # [..G]
ULONG        Capabilities   # [..G] vHidd_Controller_Cap_*
ULONG        Sequence       # [..G] Current reading sequence number
BOOL         SensorsEnabled # [.SG]
APTR         Device         # [I..] Consumer: bind to this device object
UWORD        DeviceFilter   # [I..] Consumer: bind to this device id (0 = all)
ULONG        EventMask      # [I..] Consumer: vHidd_Controller_EventMask() bits
APTR         NotifyTask     # [I..] Consumer: struct Task to Signal()
ULONG        NotifySignal   # [I..] Consumer: signal bit number
APTR         NotifyPort     # [I..] Consumer: struct MsgPort receiving Hidd_Controller_EventMsg
UWORD        QueueDepth     # [I..] Consumer: queue depth for signal/port modes
BOOL         Coalesce       # [I..] Consumer: keep only latest motion event per control
##end attributelist

##begin methodlist
ULONG GetReading(struct pHidd_Controller_Reading *dst)
BOOL GetControlInfo(UBYTE kind, UBYTE index, struct Hidd_Controller_ControlDesc *dst)
BOOL GetOutputInfo(UBYTE index, struct Hidd_Controller_OutputDesc *dst)
BOOL GetBinding(UWORD stdid, struct Hidd_Controller_Binding *dst)
UWORD GetLabel(UWORD stdid)
BOOL GetPowerInfo(struct pHidd_Controller_PowerInfo *dst)
ULONG GetSensorData(UBYTE sensor, struct pHidd_Controller_SensorSample *dst, ULONG max)
BOOL GetTouchpadFinger(UBYTE pad, UBYTE finger, struct pHidd_Controller_Finger *dst)
BOOL GetEvent(struct pHidd_Controller_Event *dst)
ULONG GetBindings(struct Hidd_Controller_Binding *buffer, ULONG max)
BOOL SetRumble(struct pHidd_Controller_Rumble *params)
BOOL SetLED(UBYTE red, UBYTE green, UBYTE blue)
BOOL SetPlayerIndex(WORD index)
BOOL SendEffect(APTR data, ULONG size)
BOOL SetSensorsEnabled(BOOL enable)
LONG UploadEffect(struct pHidd_Controller_Effect *effect)
BOOL UpdateEffect(LONG id, struct pHidd_Controller_Effect *effect)
BOOL PlayEffect(LONG id, ULONG loops)
BOOL StopEffect(LONG id)
BOOL RemoveEffect(LONG id)
BOOL SetGain(UWORD gain)
BOOL SetAutocenter(UWORD strength)
void PushValue(UBYTE kind, UBYTE index, LONG value, UQUAD timestamp)
void PushReport(struct pHidd_Controller_RawReport *report)
void PushTouch(UBYTE pad, UBYTE finger, struct pHidd_Controller_Finger *state)
void PushSensor(UBYTE sensor, struct pHidd_Controller_SensorSample *samples, ULONG count)
void PushPower(struct pHidd_Controller_PowerInfo *power)
void SetConnected(BOOL connected)
##end methodlist
##end interface

##begin interface
##begin config
interfaceid   hw.input.controller
interfacename HW_Controller
methodstub    HW_Controller
methodbase    HWControllerBase
attributebase HWControllerAB
##end config

##begin attributelist
ULONG DeviceCount     # [..G] Number of connected devices
ULONG ClockFrequency  # [..G] EClock ticks per second used for timestamps
UBYTE SlotPolicy      # [.SG] vHidd_Controller_SlotPolicy_*
UWORD Version         # [..G] HIDD_CONTROLLER_API_VERSION
##end attributelist

##begin methodlist
OOP_Object *FindDevice(UWORD deviceid)
ULONG GetDeviceIDs(UWORD *buffer, ULONG max)
BOOL AddMapping(struct Hidd_Controller_MappingDesc *mapping, UBYTE source)
BOOL RemoveMapping(APTR guid, UBYTE source)
BOOL Configure(struct TagItem *tags)
BOOL AssignSlot(UBYTE slot, UWORD deviceid)
UWORD GetSlotDevice(UBYTE slot)
##end methodlist
##end interface

