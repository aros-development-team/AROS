# timesync.conf - configuration of the AROSTCP clock synchronisation service
# (SYS:System/Network/Services/timesyncd).  The daemon reads
# ENV:AROSTCP/timesync.conf (falling back to ENVARC:) and re-reads it when
# the file changes, so an edit takes effect without a restart.
#
# Key=Value, one per line; '#' starts a comment.  Keys are case-insensitive.

# NTP servers, tried in this order until one answers.  Repeat the key or
# list several separated by spaces or commas.  Host names or IPv4 addresses.
Server=pool.ntp.org

# Seconds between synchronisations (60 .. 604800).
Interval=3600

# Seconds to wait for a server's reply (1 .. 60).
Timeout=5

# Seconds before the first retry after a failed sync; doubles on each
# further failure up to Interval.
Retry=60

# Whether to set the system clock at all (no = just report the offset).
SetClock=yes

# Whether to write the corrected time to the battery-backed clock as well
# (as SetClock SAVE would).
SetBattClock=yes

# Offset of the system clock from UTC in minutes EAST of Greenwich (for
# example 120 for EET, -300 for US Eastern), or "auto" to take it from the
# Locale preferences, which is right for everyone who has set their time
# zone there.
UTCOffset=auto

# Where to append a line per sync and error; "none" for no log.
LogFile=T:timesync.log

# Report every sync on standard output too (only useful from a shell).
Verbose=no
