#
# stack.cfg - what the stack program and its protocol libraries are built
# from, in ONE place. Included (after config/aros.cfg) by
#
#       bsdsocket/mmakefile.src         the stack program: the core
#       modules/transport/mmakefile.src transport.prot
#       modules/inet/mmakefile.src      inet.prot
#       modules/inet6/mmakefile.src     inet6.prot
#       modules/demo/mmakefile.src      demo.atcp
#
# so that the program and every library are compiled from the same file
# lists with the same include paths and options: they share structure
# layouts, and a module compiled with other options than the core is the
# one mistake nothing else would notice.
#
# The sources stay where they are, in bsdsocket/; a module's mmakefile names
# them from its own directory ($(STACK_SRC_REL)).
#

STACK_NAME      := AROSTCP
STACK_BSDSOCKET := $(SRCDIR)/workbench/network/stacks/$(STACK_NAME)/bsdsocket

#
# NAMES AND PLACES OF THE MODULE LIBRARIES (to rename, here and
# NETMODULE_KIND_PROT / NETMODULE_KIND_ATCP / NETMODULE_LIBDIR in
# bsdsocket/net/netmodule.h - nowhere else).
#
# A module called <name> is the file <name>.<kind>, built as a library
# (modtype=library) with genmodule's suffix (modsuffix=<kind>), which also
# makes <name>.<kind> the name exec lists the library under:
#   $(STACK_MODULE_PROT)  protocol modules: inet.prot, inet6.prot,
#                         transport.prot - what PROTOCOLS names and what a
#                         module needs (nm_requires)
#   $(STACK_MODULE_ATCP)  every other module: resolver.atcp, admin.atcp,
#                         packet.atcp, netconfig.atcp, demo.atcp
# The stack makes the file's name from the module's name and kind
# (PROTOCOLS=INET loads inet.prot), so a library's name is not free.
# They are installed next to the stack's own C, S and db directories; the
# stack looks there first and then where OpenLibrary() looks (LIBS:).
#
STACK_MODULE_PROT   := prot
STACK_MODULE_ATCP   := atcp
STACK_MODULE_DIR    := System/Network/$(STACK_NAME)/Libs
# a module's sources, seen from its directory modules/<name>/
STACK_SRC_REL       := ../../bsdsocket

#
# AROSTCP_MONOLITHIC (default: no)
#
#   no    the stack program is the core alone and holds no protocol code;
#         IPv4, IPv6 and the transports are the three library files.
#   yes   everything is linked into the stack program, as it was before the
#         stack was split - for debugging (one binary, one symbol table).
#         The three protocol libraries are still built by their own
#         targets but are not used by such a program: a module that is
#         part of the program is never also loaded.
#
# Set it on mmake's command line or in the environment, e.g.
#       AROSTCP_MONOLITHIC=yes make workbench-network-stacks-arostcp-bsdsocket
# The protocol sources build both ways unchanged: -DNETMODULE, which only
# the libraries are compiled with, selects the mapping of the core's names
# (bsdsocket/net/netcore_map.h) and the library form of the module
# descriptor (bsdsocket/net/netmodule.h).
#
AROSTCP_MONOLITHIC ?= no

# ---------------------------------------------------------------------------
# The four groups of source files (paths relative to bsdsocket/, no suffix).
# A file belongs to exactly one.
# ---------------------------------------------------------------------------

#
# The core: interfaces, routing, sockets, memory, timers, configuration,
# the application interface (bsdsocket.library and the others), the module
# registry and loader. Names no protocol.
#
STACK_NET_C := \
	net/if net/if_loop net/pfil \
	net/raw_cb net/raw_usrreq \
	net/route net/radix \
	net/if_sana net/netisr net/sana2config \
	net/sana2copybuff net/sana2perror

STACK_KERN_C := \
	kern/amiga_main kern/amiga_time kern/amiga_config \
	kern/amiga_netdb kern/amiga_request kern/amiga_cx \
	kern/amiga_dhcp kern/amiga_rc kern/kern_subr \
	kern/kern_synch kern/kern_malloc kern/uipc_mbuf \
	kern/uipc_domain kern/uipc_socket kern/uipc_socket2 \
	kern/amiga_log kern/amiga_cstr kern/amiga_rexx \
	kern/subr_prf kern/accesscontrol kern/config_var \
	kern/kern_sysctl kern/amiga_netsvc kern/amiga_svcmgr kern/net_module \
	kern/net_services kern/net_modload kern/net_demand \
	kern/kern_random

STACK_API_C := \
	api/amiga_api api/amiga_libtables api/amiga_syscalls \
	api/amiga_fdhooks \
	api/amiga_sendrecv api/amiga_generic api/amiga_generic2 \
	api/amiga_libcalls api/amiga_errlists api/amiga_kernvars \
	api/amiga_ndbent api/amiga_netstat \
	api/getxbyy api/amiga_hostname api/allocdatabuffer \
	api/amiga_roadshow api/miami_api api/miami_functable \
	api/netservice_api api/netservice_functable \
	api/if_indextoname api/if_nametoindex api/if_nameindex \
	api/getifaddrs api/inet_pton api/inet_ntop

#
# THE OPTIONAL PARTS OF THE CORE (Stage 7): groups of files built as module
# libraries of their own, each described in its own file under conf/. The
# first three are loaded on first use; netconfig by the stack itself for the
# start-up configuration read and for every reload, and dropped after:
#
#   conf/group-resolver.cfg     resolver        resolver.atcp
#   conf/group-admin.cfg        administration  admin.atcp
#   conf/group-packet.cfg       packet services packet.atcp
#   conf/group-netconfig.cfg    configuration   netconfig.atcp
#
# Each defines STACK_<X>_C (the library's files), STACK_<X>_CORE_C (its stub
# files, always part of the program) and STACK_<X>_IN_CORE. While the switch
# says yes - and always in a monolithic program - STACK_<X>_C is linked into
# the program, as before the groups existed; otherwise it is in
# STACK_OPTIONAL_C, which only the module libraries are built from.
#
# Found in the source tree, or - where SRCDIR does not lead to it, as when
# tools/netcore-update.sh reads this file without a build directory - next
# to this file.
#
STACK_CFG_DIR := $(if $(wildcard $(STACK_BSDSOCKET)/stack.cfg),$(STACK_BSDSOCKET)/,$(dir $(lastword $(MAKEFILE_LIST))))
include $(STACK_CFG_DIR)conf/group-resolver.cfg
include $(STACK_CFG_DIR)conf/group-admin.cfg
include $(STACK_CFG_DIR)conf/group-packet.cfg
include $(STACK_CFG_DIR)conf/group-netconfig.cfg

STACK_CORE_C := $(STACK_NET_C) $(STACK_KERN_C) $(STACK_API_C) \
	$(STACK_RESOLVER_CORE_C) $(STACK_ADMIN_CORE_C) $(STACK_PACKET_CORE_C)
STACK_OPTIONAL_C :=

ifeq ($(STACK_RESOLVER_IN_CORE),yes)
STACK_CORE_C += $(STACK_RESOLVER_C)
else
STACK_OPTIONAL_C += $(STACK_RESOLVER_C)
endif
ifeq ($(STACK_ADMIN_IN_CORE),yes)
STACK_CORE_C += $(STACK_ADMIN_C)
else
STACK_OPTIONAL_C += $(STACK_ADMIN_C)
endif
ifeq ($(STACK_PACKET_IN_CORE),yes)
STACK_CORE_C += $(STACK_PACKET_C)
else
STACK_OPTIONAL_C += $(STACK_PACKET_C)
endif
STACK_CORE_C += $(STACK_NETCONFIG_CORE_C)
ifeq ($(STACK_NETCONFIG_IN_CORE),yes)
STACK_CORE_C += $(STACK_NETCONFIG_C)
else
STACK_OPTIONAL_C += $(STACK_NETCONFIG_C)
endif

#
# The transports - module "transport": TCP, UDP and the raw sockets, one
# implementation each for every address family, and the PCB layer.
#
STACK_TRANSPORT_C := \
	netinet/inet_transport netinet/in_pcb netinet/raw_ip \
	netinet/tcp_debug netinet/tcp_input netinet/tcp_output \
	netinet/tcp_subr netinet/tcp_syncache netinet/tcp_timer netinet/tcp_usrreq \
	netinet/tcp_cc_newreno netinet/tcp_cc_cubic netinet/tcp_ss netinet/tcp_rack \
	netinet/udp_usrreq

#
# IPv4 - module "inet": IP, ICMP, IGMP, ARP, IPv4's side of the family
# interface.
#
STACK_INET_C := \
	netinet/in netinet/in_family netinet/in_family_pcb \
	netinet/in_family_raw netinet/in_family_udp netinet/in_proto \
	netinet/ip_icmp netinet/ip_input netinet/ip_output \
	netinet/igmp net/sana2arp

#
# IPv6 - module "inet6": IPv6, ICMPv6, neighbour discovery, MLD, IPv6's
# side of the family interface, the 6in4 tunnel.
#
STACK_INET6_C := \
	netinet6/in6 netinet6/in6_family netinet6/in6_family_pcb \
	netinet6/in6_family_raw netinet6/in6_family_udp netinet6/in6_proto \
	netinet6/ip6_input netinet6/ip6_output \
	netinet6/icmp6 netinet6/nd6 netinet6/nd6_nbr netinet6/nd6_rtr \
	netinet6/mld6 net/if_stf

#
# The checksum routines, one file per processor: each family has its own
# (IPv4 the Internet checksum, IPv6 the same with its pseudo-header), and
# each goes with its family.
#
ifeq ($(AROS_TARGET_CPU),x86_64)
STACK_INET_C  += netinet/in_cksum_sse2
STACK_INET6_C += netinet6/in6_cksum_sse2
else ifeq ($(AROS_TARGET_CPU),aarch64)
STACK_INET_C  += netinet/in_cksum_neon
STACK_INET6_C += netinet6/in6_cksum_neon
else
STACK_INET_C  += netinet/in_cksum
STACK_INET6_C += netinet6/in6_cksum
endif

# every protocol file, and the optional parts that are module libraries
# now: what a monolithic program has besides the core
STACK_PROTOCOL_C := $(STACK_TRANSPORT_C) $(STACK_INET_C) $(STACK_INET6_C) \
	$(STACK_OPTIONAL_C)

# what every module library has besides its own files: the shared glue
STACK_MODULE_GLUE := net/netmodule_lib
# ... and the one .conf file all of them are generated from
STACK_MODULE_CONF := $(STACK_BSDSOCKET)/net/netmodule.conf

# ---------------------------------------------------------------------------
# Compiler options - the same for the program and for every library, but for
# -DNETMODULE.
# ---------------------------------------------------------------------------

STACK_INCLUDES := -idirafter $(STACK_BSDSOCKET) -idirafter $(STACK_BSDSOCKET)/protos
STACK_NOWARN_FLAGS := $(NOWARN_UNINITIALIZED) $(NOWARN_PARENTHESES)
# enabling -DUSE_ALIGNED_COPIES  causes crashes..
STACK_CPPFLAGS := \
	-DDIRECTED_BROADCAST \
	-DENABLE_MULTICAST \
	-DENABLE_FDLIBRARY \
	-DAMITCP -DKERNEL \
	-DENABLE_SYSCTL \
	-D_XOPEN_SOURCE=600 \
	-D__BSD_VISIBLE=1
#STACK_CPPFLAGS += -DDEBUG=1
STACK_CFLAGS := $(CFLAGS_GNU99) $(STACK_NOWARN_FLAGS)

# a module library: the core's names through its table, the descriptor as
# the glue expects it
STACK_MODULE_CPPFLAGS := $(STACK_CPPFLAGS) -DNETMODULE
# the few C library functions the compiler or the code calls (memcpy,
# memset, memcmp, memmove, strnlen, snprintf) come from the static library:
# a module opens no C library of its own
STACK_MODULE_LDFLAGS := -static
