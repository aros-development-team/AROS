#
# group-resolver.cfg - the resolver: the DNS resolver and its cache, the
# hosts table's half of gethostbyname() and gethostbyaddr(), and the name
# look-ups of both front-ends (bsdsocket.library: gethostbyname_r() ...
# getnameinfo(); miami.library: gethostbyname2() ... getnameinfo(), the
# resolver options). Included by ../stack.cfg; owned by Stage 7 package R.
#
#   STACK_RESOLVER_C        what becomes resolver.atcp
#   STACK_RESOLVER_CORE_C   what stays in the stack program whatever the
#                           switch says (the stubs that keep the vectors)
#   STACK_RESOLVER_IN_CORE  yes: STACK_RESOLVER_C is linked into the stack
#                           program, as it always was; no: it is the module
#                           library (set when that works)
#
# Paths relative to bsdsocket/, no suffix. (api/res_debug.c is in no group:
# all of it is for RES_DEBUG, which the stack is never built with.)
#

STACK_RESOLVER_C := \
	api/res_comp api/res_init \
	api/res_mkquery api/res_query api/res_send \
	api/dns_cache api/gethostnamadr api/gethtent \
	api/rs_names api/resolver_module

# the vectors' stubs, what is answered without the library (numeric
# addresses, freeaddrinfo(), gai_strerror(), the resolver options) and the
# demand slot - api/resolver_ops.h
STACK_RESOLVER_CORE_C := api/resolver_stubs

STACK_RESOLVER_IN_CORE := no
