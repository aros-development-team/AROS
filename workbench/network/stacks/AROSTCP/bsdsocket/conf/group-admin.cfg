# group-admin.cfg - administration: the routing socket (PF_ROUTE), the
# route, interface and name-server calls of bsdsocket.library and the
# control-panel glue. Included by ../stack.cfg; owned by Stage 7 package A.
# The module is "admin" (kern/admin_ops.h, kern/admin_module.c); it is
# started on first use, also when it is part of the stack program.
#
#   STACK_ADMIN_C           what becomes admin.atcp
#   STACK_ADMIN_CORE_C      what stays in the stack program whatever the
#                           switch says (the stubs that keep the vectors,
#                           the routing messages and the panel's variables)
#   STACK_ADMIN_IN_CORE     yes: STACK_ADMIN_C is linked into the stack
#                           program, as it always was; no: it is the module
#                           library (set when that works)
#
# Paths relative to bsdsocket/, no suffix.
#

STACK_ADMIN_C := \
	net/rtsock api/rs_admin \
	kern/amiga_gui kern/admin_module

# the vectors' stubs, the calls that give a list back or are not
# implemented, the three routing messages, the panel's calls from NETTRACE
# and its variables, the demand slot (kern/admin_stubs.c); and the ARexx
# reports (kern/amiga_cstat.c), which NETTRACE must answer without waiting
# for a module to be loaded
STACK_ADMIN_CORE_C := kern/admin_stubs kern/amiga_cstat

STACK_ADMIN_IN_CORE := no
