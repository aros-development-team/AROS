# group-netconfig.cfg - the configuration readers: the command line and
# db/general.config, db/netdb and the files it includes (interfaces, hosts,
# services, protocols, networks, inet.access, static-routes ...), the
# interface line's arguments, db/services.d. Included by ../stack.cfg.
# The module is "netconfig" (kern/netconfig_ops.h, kern/netconfig_module.c);
# the stack's task starts it for a read - at start-up, at a reload, for an
# ARexx ADD, RESET or SET WITH - and stops it after, also when it is part
# of the stack program (maintainer's decision D19).
#
#   STACK_NETCONFIG_C       what becomes netconfig.atcp
#   STACK_NETCONFIG_CORE_C  what stays in the stack program whatever the
#                           switch says (the functions the core calls by
#                           their old names, the demand slot, the interface
#                           lines that wait for their device)
#   STACK_NETCONFIG_IN_CORE yes: STACK_NETCONFIG_C is linked into the stack
#                           program; no: it is the module library. Without
#                           the library (and not built in) the stack does
#                           not start: it cannot read its configuration.
#
# Paths relative to bsdsocket/, no suffix.
#

#   kern/netconfig_iface    the interfaces of the configuration: made of
#                           their lines, the requester when a device does
#                           not open, those a reload no longer names removed
#
STACK_NETCONFIG_C := kern/netconfig_module kern/netconfig_iface

STACK_NETCONFIG_CORE_C := kern/netconfig_stubs

STACK_NETCONFIG_IN_CORE := no
