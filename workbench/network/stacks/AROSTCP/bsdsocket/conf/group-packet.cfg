# group-packet.cfg - the packet services: the filter and NAT engine, packet
# capture (BPF) and the capture calls of bsdsocket.library - module
# "packet", packet.atcp (net/packet_ops.h,
# modules/packet/mmakefile.src). Included by ../stack.cfg; owned by Stage 7
# package P3 (the filter engine's own file by P2). The packet hook points
# (net/pfil) are the core's and are not here.
#
#   STACK_PACKET_C          what becomes packet.atcp
#   STACK_PACKET_CORE_C     what stays in the stack program whatever the
#                           switch says (the stubs that keep the vectors,
#                           the capture tap)
#   STACK_PACKET_IN_CORE    yes: STACK_PACKET_C is linked into the stack
#                           program, as it always was; no: it is the module
#                           library (set when that works)
#
# Paths relative to bsdsocket/, no suffix.
#

STACK_PACKET_C := \
	net/ipfilter net/bpf net/bpf_filter \
	api/rs_bpf net/packet_module

STACK_PACKET_CORE_C := \
	net/packet_stubs

STACK_PACKET_IN_CORE := no
