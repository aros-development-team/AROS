##begin config
version 45.0
libbase PamBase
libbasetype struct PamBase
libbasetypeextern struct Library
residentpri 0
rellib stdc
##end config

##begin cdef
#include <proto/exec.h>
#include <utility/tagitem.h>
#include <utility/hooks.h>
#include <libraries/pam.h>
##end cdef

##begin cdefprivate
#include "pam_intern.h"
##end cdefprivate

##begin functionlist
struct PamHandle *PamStartA(CONST_STRPTR service, CONST_STRPTR user, struct Hook *conv, struct TagItem *tags) (A0, A1, A2, A3)
LONG PamEnd(struct PamHandle *handle, LONG status) (A0, D0)
LONG PamSetItem(struct PamHandle *handle, ULONG item, APTR value) (A0, D0, A1)
LONG PamGetItem(struct PamHandle *handle, ULONG item, APTR *value) (A0, D0, A1)
CONST_STRPTR PamStrError(struct PamHandle *handle, LONG code) (A0, D0)
LONG PamAuthenticate(struct PamHandle *handle, ULONG flags) (A0, D0)
LONG PamSetCred(struct PamHandle *handle, ULONG flags) (A0, D0)
LONG PamAcctMgmt(struct PamHandle *handle, ULONG flags) (A0, D0)
LONG PamOpenSession(struct PamHandle *handle, ULONG flags) (A0, D0)
LONG PamCloseSession(struct PamHandle *handle, ULONG flags) (A0, D0)
LONG PamChAuthTok(struct PamHandle *handle, ULONG flags) (A0, D0)
LONG PamGetUser(struct PamHandle *handle, CONST_STRPTR *user, CONST_STRPTR prompt) (A0, A1, A2)
LONG PamGetAuthTok(struct PamHandle *handle, ULONG item, CONST_STRPTR *tok, CONST_STRPTR prompt) (A0, D0, A1, A2)
LONG PamConverse(struct PamHandle *handle, LONG nmsg, const struct pam_message **msgs, struct pam_response **resp) (A0, D0, A1, A2)
LONG PamSetData(struct PamHandle *handle, CONST_STRPTR name, APTR data, PamDataCleanup cleanup) (A0, A1, A2, A3)
LONG PamGetData(struct PamHandle *handle, CONST_STRPTR name, APTR *data) (A0, A1, A2)
LONG PamFailDelay(struct PamHandle *handle, ULONG usec) (A0, D0)
void PamLog(struct PamHandle *handle, LONG level, CONST_STRPTR text) (A0, D0, A1)
##end functionlist
