# Common configuration for mesa3d

FFLAGS := --nounistd
BFLAGS := -d

aros_mesadir := workbench/libs/mesa
##top_mesa3dgldir := $(SRCDIR)/$(aros_mesadir)       # original AROS mesa
##top_mesa3dgldir := $(SRCDIR)/local/vc4/mesa
top_mesa3dgldir=$(PORTSDIR)/mesa/$(ARCHBASE)
top_srcdir=$(top_mesa3dgldir)

ifeq ($(OPT_MESAGL),)
OPT_MESAGL=26.0.0
endif

DOTS := $(subst ., ,$(OPT_MESAGL))
MESAGL_MAJOR = $(word 1, $(DOTS))
MESAGL_MINOR = $(word 2, $(DOTS))
MESAGL_PATCH = $(word 3, $(DOTS))

MESAGLVERSION=$(OPT_MESAGL)
MESAGLBUILD=$(MESAGL_MAJOR)-$(MESAGL_MINOR)

#MESAVERSION=$(shell cat $(top_srcdir)/VERSION)
MESAGLREVERSION=
REPOSITORIES := https://archive.mesa3d.org/ https://archive.mesa3d.org/older-versions/$(MESAGL_MAJOR).x
ifeq ($(MESAGLREVERSION),)
    ARCHBASE     := mesa-$(MESAGLVERSION)
else
    ARCHBASE     := mesa-$(MESAGLVERSION)-$(MESAGLREVERSION)
endif

# Apply a version patch only when a real patch file exists in-tree.
PATCHFILE := $(SRCDIR)/$(aros_mesadir)/$(ARCHBASE)-aros.diff
ifneq ($(wildcard $(PATCHFILE)),)
PATCHSPEC := $(ARCHBASE)-aros.diff:$(ARCHBASE):-p1
else
PATCHSPEC :=
endif

ifeq ($(AROS_TARGET_CPU),x86_64)
MESA_USE_ASM=TRUE
endif

top_builddir := $(GENDIR)/$(aros_mesadir)/$(MESAGLVERSION)
top_libdir := $(GENDIR)/lib/mesa$(MESAGLVERSION)

ifneq ($(wildcard $(top_srcdir)/src/mapi/glapi/gen),)
glapi := $(top_srcdir)/src/mapi/glapi/gen
else
glapi := $(top_srcdir)/src/mesa/glapi/glapi/gen
endif

USER_INCLUDES := \
            -I$(top_srcdir)/include \
            -I$(top_srcdir)/include/GL \
            -I$(top_srcdir)/src

MESA_STDC_FLAGS := \
            -D__STDC_CONSTANT_MACROS \
            -D__STDC_FORMAT_MACROS \
            -D__STDC_LIMIT_MACROS

MESA_POSIXC_FLAGS := \
            -D_GNU_SOURCE \
            -DHAVE_PTHREAD \
            -DHAVE_TIMESPEC_GET \
            -DPOSIXC_SLOWSTACK_VAARGS

# HAVE_POSIX_MEMALIGN makes os_malloc_aligned() use posix_memalign(). On Mesa
# 20.0.8 that binds to stdc.library and faults on a NULL StdCBase in the
# mesa3dgl context (crash at 0xfffffaec); left off, os_malloc_aligned falls back
# to manual malloc-based alignment via emul_arosc's pool-independent malloc.
# Mesa 21 removed that posix_memalign path, so the flag is safe to enable on a
# 21 build (OPT_MESAGL). Keep it off for 20.0.8.
#MESA_POSIXC_FLAGS += \
#            -DHAVE_POSIX_MEMALIGN

# p_atomic_*() via __atomic_* rather than the legacy __sync_* builtins. On
# i386 a 64-bit atomic is out of line (i486 has no cmpxchg8b) and libatomic
# carries only the C11 names, so __sync_add_and_fetch_8 links undefined.
MESA_BASEFLAGS := \
            $(MESA_STDC_FLAGS) \
            $(MESA_POSIXC_FLAGS) \
            -DHAVE_ZLIB \
            -DHAVE_FUNC_ATTRIBUTE_PACKED \
            -DHAVE_OPENGL=1 \
            -DHAVE_OPENGL_ES_1=1 \
            -DHAVE_OPENGL_ES_2=1

MESA_BASEFLAGS += -DUTIL_ARCH_LITTLE_ENDIAN=$(if $(filter m68k,$(CPU)),0,1) -DUTIL_ARCH_BIG_ENDIAN=$(if $(filter m68k,$(CPU)),1,0)

# m68k has no 64bit atomic operations; use the mutex based fallbacks in
# src/util/u_atomic.c (as upstream does when its probe fails).
ifeq ($(CPU),m68k)
MESA_BASEFLAGS += -DMISSING_64BIT_ATOMICS
endif

ifneq ($(CFLAGS_NO_BUILTIN_FFS),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_FFS
endif
ifneq ($(CFLAGS_NO_BUILTIN_FFSLL),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_FFSLL
endif
ifneq ($(CFLAGS_NO_BUILTIN_BSWAP32),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_BSWAP32
endif
ifneq ($(CFLAGS_NO_BUILTIN_BSWAP64),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_BSWAP64
endif
ifneq ($(CFLAGS_NO_BUILTIN_CLZ),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_CLZ
endif
ifneq ($(CFLAGS_NO_BUILTIN_CLZLL),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_CLZLL
endif
ifneq ($(CFLAGS_NO_BUILTIN_CTZ),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_CTZ
endif
ifneq ($(CFLAGS_NO_BUILTIN_EXPECT),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_EXPECT
endif
ifneq ($(CFLAGS_NO_BUILTIN_POPCOUNT),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_POPCOUNT
endif
ifneq ($(CFLAGS_NO_BUILTIN_POPCOUNTLL),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_POPCOUNTLL
endif
ifneq ($(CFLAGS_NO_BUILTIN_UNREACHABLE),)
MESA_BASEFLAGS += \
            -DHAVE___BUILTIN_UNREACHABLE
endif

#            -DHAVE_FUNC_ATTRIBUTE_FORMAT
#            -DHAVE_FUNC_ATTRIBUTE_PACKED
#            -DHAVE_FUNC_ATTRIBUTE_RETURNS_NONNULL
#            -DHAVE_FUNC_ATTRIBUTE_ALIAS
#            -DHAVE_FUNC_ATTRIBUTE_NORETURN

#            -DENABLE_SHADER_CACHE

ifeq ($(MESA_USE_ASM),TRUE)
#ifeq ($(AROS_TARGET_ARCH),i386)
#MESA_BASEFLAGS += -DUSE_X86_ASM
#MESA_USE_X86=TRUE
#endif
ifeq ($(AROS_TARGET_CPU),x86_64)
MESA_BASEFLAGS += -DUSE_X86_64_ASM
MESA_USE_X86_64=TRUE
MESA_BASEFLAGS += -DUSE_SSE41
MESA_USE_SSE41=TRUE
endif
endif

MESA_COMPILEFLAGS := \
            $(MESA_BASEFLAGS) \
            -DMAPI_MODE_GLAPI \
            -DMAPI_MODE_UTIL \

MESA_NOWARNFLAGS := \
            $(NOWARN_MISSING_FIELD_INITIALIZERS) \
            $(NOWARN_FORMAT_TRUNCATION)

MESA_DEBUG := -DNDEBUG
#MESA_DEBUG := -DDEBUG
#MESA_DEBUG := -DNDEBUG
# Asserts ON. -DNDEBUG previously suppressed every Mesa assert() (incl.
# NIR validator aborts) to dodge cosmetic invariants, but it also hid
# wild-pointer crashes. Keep asserts on; patch a specific cosmetic assert
# out via mesa-20.0.8-aros.diff rather than disabling them globally.

# Pin to gnu11 (Mesa 21's baseline). gcc-16 defaults to gnu23, whose
# <stddef.h> 0-arg unreachable() collides with Mesa's 1-arg unreachable(str)
# in src/util/macros.h (and other C23 macro/keyword changes).
MESA_STD := $(CFLAGS_GNU11)

USER_CPPFLAGS = $(MESA_COMPILEFLAGS) $(MESA_DEBUG)
# -fno-strict-aliasing is not optional: upstream Mesa builds with it, and
# its compiler code (NIR/GLSL/QIR) type-puns freely. gcc exploits strict
# aliasing far more than clang, which showed up as a hang in the vc4
# shader compiler on a gcc-16 build.
USER_CFLAGS =  $(MESA_STD) $(MESA_COMPILEOPTIONS) $(CFLAGS_NO_STRICT_ALIASING) $(CFLAGS_FAST_MATH) $(CFLAGS_NO_MATH_ERRNO) $(CFLAGS_NO_TRAPPING_MATH) $(CFLAGS_VISIBILITY_HIDDEN) $(CFLAGS_MERGE_CONSTANTS)
# Mesa targets C++17 (cpp_std=c++17 in meson.build); newer gcc defaults to a
# later standard where some of its initializer forms become hard errors.
# Mesa's C++ (glsl ir, nouveau codegen) stores into objects from placement
# operator new before the constructor runs; gcc's lifetime dead-store
# elimination would drop those stores, so upstream builds with
# -flifetime-dse=1 and so must we. config/features probes for it
# (CXXFLAGS_LIFETIME_DSE1 is empty on compilers that lack the option).
USER_CXXFLAGS =  $(CXXFLAGS_CXX17) $(CXXFLAGS_LIFETIME_DSE1) $(MESA_COMPILEOPTIONS) $(CFLAGS_FAST_MATH) $(CFLAGS_NO_MATH_ERRNO) $(CFLAGS_NO_TRAPPING_MATH) $(CFLAGS_VISIBILITY_HIDDEN) $(CFLAGS_MERGE_CONSTANTS)
#USER_LDFLAGS := -Wl,-Bsymbolic

# Gallium core linklibs statically included into mesa3dgl.library
# (empty = softpipe only). Pulled into mesa3dgl's uselibs so their
# Mesa-side code shares one ralloc/util instance.
MESA3DGL_GALLIUMCORE :=

# raspi/arm: the GalliumCoreAPI provider table (generated gca_table.c).
# The vc4 pipe driver itself lives in vc4gallium.hidd since the runtime-
# binding rework; mesa3dgl only exports its compiler core through this
# table. Built by the vc4gallium hidd's mmakefile, which only builds for
# AROS_TARGET_CPU=arm - AROS_TARGET_ARCH alone is "raspi" for the aarch64
# target too, and the generated trampolines are 32-bit ARM.
ifeq ($(AROS_TARGET_ARCH),raspi)
MESA3DGL_GALLIUMCORE += galliumcoreapi
endif
