# Rust cross compiler for AROS.
#
# Included by tools/crosstools/rust/mmakefile.src and by any mmakefile that
# builds Rust code for the target. Everything here derives from target.cfg
# (TARGET_RUST, TARGET_RUST_VER) and the AROS_TARGET_CPU / AROS_HOST_* values,
# so the same rust toolchain works with both the gnu and the llvm AROS
# toolchains: the target C driver is only reached through the
# $(AROS_TARGET_CPU)-aros-cc wrapper the rust crosstool installs.

ifeq ($(TARGET_RUST_VER),)
    RUST_VERSION:=1.98.1
else
    RUST_VERSION:=$(TARGET_RUST_VER)
endif

# AArch64/LLVM uses the qualified official nightly and a library-only port.
# Other targets retain their existing source-bootstrap recipe until qualified.
RUST_OFFICIAL := $(if $(filter nightly-2026-08-04,$(RUST_VERSION)),yes,no)
ifeq ($(RUST_OFFICIAL),yes)
ifneq ($(AROS_TARGET_CPU):$(AROS_TOOLCHAIN),aarch64:llvm)
$(error The official Rust profile is qualified only for AArch64 with LLVM)
endif
RUST_INSTALL_PREFIX := $(CROSSTOOLSDIR)/rust-$(RUST_VERSION)-$(AROS_TARGET_CPU)
else
RUST_INSTALL_PREFIX := $(CROSSTOOLSDIR)
endif

# The compiler is bootstrapped with a binary release of the same version
# (rust's bootstrap accepts the same or the previous minor release). Only
# the three components the build needs are fetched.
RUST_STAGE0_VERSION := $(RUST_VERSION)
RUST_STAGE0_COMPONENTS := rustc rust-std cargo

# bindgen generates Rust bindings for C headers and cbindgen C headers for
# Rust crates (mesa's NAK and NIL need both). They are crates.io tools, so
# they are installed with the freshly built cargo.
RUST_BINDGEN_VERSION := 0.72.1
RUST_CBINDGEN_VERSION := 0.29.4

RUST_REPOSITORY := https://static.rust-lang.org/dist

# Rust's name for the machine the toolchain runs on.
ifeq ($(AROS_HOST_ARCH),linux)
    RUST_HOST_OS := unknown-linux-gnu
else ifeq ($(AROS_HOST_ARCH),darwin)
    RUST_HOST_OS := apple-darwin
else ifeq ($(AROS_HOST_ARCH),freebsd)
    RUST_HOST_OS := unknown-freebsd
else
    RUST_HOST_OS := unknown-linux-gnu
endif
ifeq ($(AROS_HOST_CPU),i386)
    RUST_HOST_CPU := i686
else
    RUST_HOST_CPU := $(AROS_HOST_CPU)
endif
RUST_HOST_TRIPLE := $(RUST_HOST_CPU)-$(RUST_HOST_OS)

# Suffix of host proc-macro crates; rustc rejects --extern paths without it.
ifeq ($(AROS_HOST_ARCH),darwin)
    RUST_HOST_DYLIB_EXT := dylib
else
    RUST_HOST_DYLIB_EXT := so
endif

# Rust's name for the AROS target, and the LLVM backend it needs.
ifeq ($(AROS_TARGET_CPU),x86_64)
    RUST_TARGET_TRIPLE := x86_64-unknown-aros
    RUST_LLVM_TARGET := X86
else ifeq ($(AROS_TARGET_CPU),i386)
    RUST_TARGET_TRIPLE := i686-unknown-aros
    RUST_LLVM_TARGET := X86
else ifeq ($(AROS_TARGET_CPU),arm)
    RUST_TARGET_TRIPLE := arm-unknown-aros-eabihf
    RUST_LLVM_TARGET := ARM
else ifeq ($(AROS_TARGET_CPU),aarch64)
    RUST_TARGET_TRIPLE := aarch64-unknown-aros
    RUST_LLVM_TARGET := AArch64
else ifeq ($(AROS_TARGET_CPU),riscv64)
    RUST_TARGET_TRIPLE := riscv64gc-unknown-aros
    RUST_LLVM_TARGET := RISCV
else ifeq ($(AROS_TARGET_CPU),m68k)
    RUST_TARGET_TRIPLE := m68k-unknown-aros
    RUST_LLVM_TARGET := M68k
else ifeq ($(AROS_TARGET_CPU),ppc)
    RUST_TARGET_TRIPLE := powerpc-unknown-aros
    RUST_LLVM_TARGET := PowerPC
else
    RUST_TARGET_TRIPLE :=
    RUST_LLVM_TARGET :=
endif

# M68k is still an experimental backend in the LLVM rust bundles.
ifeq ($(RUST_LLVM_TARGET),M68k)
    RUST_LLVM_TARGETS := X86
    RUST_LLVM_EXPERIMENTAL_TARGETS := M68k
else
    RUST_LLVM_TARGETS := X86;$(RUST_LLVM_TARGET)
    RUST_LLVM_EXPERIMENTAL_TARGETS :=
endif

# What the rust crosstool installs, for mmakefiles that build Rust code.
RUST_BINDIR             := $(RUST_INSTALL_PREFIX)/bin
TARGET_RUSTC            := $(RUST_BINDIR)/rustc
HOST_CARGO              := $(RUST_BINDIR)/cargo
HOST_BINDGEN            := $(RUST_BINDIR)/bindgen
HOST_CBINDGEN           := $(RUST_BINDIR)/cbindgen
# The C driver rustc links with. It wraps $(TARGET_CC) with the ISA flags
# of this build, so it works for gnu (gcc) and llvm (clang --target=) alike.
TARGET_RUST_LINKER      := $(RUST_BINDIR)/$(AROS_TARGET_CPU)-aros-cc
RUST_TARGET_SPEC       := $(RUST_TARGET_TRIPLE)
RUST_CARGO_TARGET_FLAGS = --target $(RUST_TARGET_SPEC)
ifeq ($(RUST_OFFICIAL),yes)
RUST_TARGET_SPEC       := $(RUST_INSTALL_PREFIX)/share/$(RUST_TARGET_TRIPLE).json
RUST_CARGO_TARGET_FLAGS := --target $(RUST_TARGET_SPEC) -Zjson-target-spec
endif
TARGET_RUSTFLAGS        := --target $(RUST_TARGET_SPEC) $(if $(filter yes,$(RUST_OFFICIAL)),-Zunstable-options) -C linker=$(TARGET_RUST_LINKER) -C panic=abort
# bindgen loads libclang at run time. The llvm toolchain builds one; with
# the gnu toolchain the host's libclang is used (set LIBCLANG_PATH if it is
# not where clang-sys looks by default).
ifeq ($(AROS_TOOLCHAIN),llvm)
    RUST_LIBCLANG_PATH  := $(CROSSTOOLSDIR)/lib
else
    RUST_LIBCLANG_PATH  := $(LIBCLANG_PATH)
endif
ifneq ($(RUST_LIBCLANG_PATH),)
    HOST_BINDGEN_ENV    := LIBCLANG_PATH=$(RUST_LIBCLANG_PATH)
    RUST_CLANG_RESOURCE_INC := $(patsubst %/,%,$(dir $(firstword $(wildcard $(RUST_LIBCLANG_PATH)/clang/*/include/stdarg.h))))
else
    HOST_BINDGEN_ENV    :=
    RUST_CLANG_RESOURCE_INC := $(patsubst %/,%,$(dir $(firstword $(wildcard /usr/lib/llvm-*/lib/clang/*/include/stdarg.h /usr/lib/clang/*/include/stdarg.h /usr/lib64/clang/*/include/stdarg.h /usr/local/lib/clang/*/include/stdarg.h))))
endif
# What bindgen's clang needs to parse AROS headers like the target C
# compiler does: the same include order (gcc's -idirafter posixc/stdc), the
# target's predefined macros, and nothing from the host.
RUST_BINDGEN_CLANG_ARGS := --target=$(AROS_TARGET_CPU)-unknown-aros $(TARGET_ISA_CFLAGS) \
    -nostdinc -isystem $(RUST_CLANG_RESOURCE_INC) -isystem $(AROS_INCLUDES) \
    -idirafter $(AROS_INCLUDES)/aros/posixc -idirafter $(AROS_INCLUDES)/aros/stdc \
    -D__AROS__=1 -D__AROS=1 -DAROS=1 -D__ELF__=1

# The shared crate store, for every mmakefile that builds Rust code (see
# tools/crosstools/rust/crates and contrib/development/rust): where crates.io
# crates are unpacked and patched, where their archives are kept, cargo's
# home for the rest of a program's dependencies, and what every cargo run in
# the tree is started with. $(RUST_CRATES_CONFIG) is the generated cargo
# config that replaces the crates.io crates with the patched ones.
RUST_CRATESDIR          := $(PORTSDIR)/rust-crates$(if $(filter yes,$(RUST_OFFICIAL)),-native)
RUST_CRATES_SOURCEDIR   := $(PORTSSOURCEDIR)/rust-crates
RUST_CARGO_HOME         := $(PORTSSOURCEDIR)/cargo-home
CRATES_IO               := https://static.crates.io/crates
RUST_CRATES_CONFIG      := $(GENDIR)/tools/crosstools/rust/crates/rust-crates.toml
# The crates written for AROS (aros-*-sys), kept in the source tree.
RUST_SYS_CRATESDIR      := $(SRCDIR)/tools/crosstools/rust/crates
ifeq ($(AROS_TOOLCHAIN),llvm)
RUST_TARGET_AR          := $(CROSSTOOLSDIR)/bin/llvm-ar
else
RUST_TARGET_AR          := $(CROSSTOOLSDIR)/$(AROS_TARGET_CPU)-aros-ar
endif
RUST_CARGO_ENV          := CARGO_HOME=$(RUST_CARGO_HOME) RUSTC=$(TARGET_RUSTC) PATH=$(RUST_BINDIR):$$PATH
# --config is a global cargo option; --manifest-path belongs after the subcommand.
# Load the installed target flags too: the SDK generation must participate in
# Cargo fingerprints even when a program also supplies its own generated config.
RUST_CARGO              := $(RUST_CARGO_ENV) $(HOST_CARGO) --config $(RUST_CRATES_CONFIG) $(if $(filter yes,$(RUST_OFFICIAL)),--config $(RUST_INSTALL_PREFIX)/cargo-config.toml)

# The build machine's paths would otherwise end up in Rust programs (panic
# locations, debug information): the build tree, the source tree, the crate
# store and cargo's home are shortened to these names. rustc takes the last
# prefix that matches, so a directory comes after the ones it is inside.
RUST_REMAP_FLAGS        := --remap-path-prefix=$(TOP)=build --remap-path-prefix=$(SRCDIR)=aros \
    --remap-path-prefix=$(PORTSDIR)=ports --remap-path-prefix=$(PORTSSOURCEDIR)=portssources \
    --remap-path-prefix=$(RUST_CARGO_HOME)=cargo
TARGET_RUSTFLAGS        += $(RUST_REMAP_FLAGS)

# The crates in the store (one version of each in the tree). The first group
# is patched for AROS (rust-crates-<name> targets); the rest are what mesa's
# NAK compiler is built from with rustc directly.
RUST_LIBC_VERSION             := 0.2.190
RUST_GETRANDOM02_VERSION      := 0.2.17
RUST_GETRANDOM03_VERSION      := 0.3.4
RUST_GETRANDOM04_VERSION      := 0.4.3
RUST_PARKING_LOT_CORE_VERSION := 0.9.12
RUST_CRATE_LIBC             := libc-$(RUST_LIBC_VERSION)
RUST_CRATE_GETRANDOM02      := getrandom-$(RUST_GETRANDOM02_VERSION)
RUST_CRATE_GETRANDOM03      := getrandom-$(RUST_GETRANDOM03_VERSION)
RUST_CRATE_GETRANDOM04      := getrandom-$(RUST_GETRANDOM04_VERSION)
RUST_CRATE_PARKING_LOT_CORE := parking_lot_core-$(RUST_PARKING_LOT_CORE_VERSION)
RUST_PASTE_VERSION          := 1.0.14
RUST_RUSTC_HASH_VERSION     := 2.1.1
RUST_SYN_VERSION            := 2.0.87
RUST_QUOTE_VERSION          := 1.0.35
RUST_PROC_MACRO2_VERSION    := 1.0.86
RUST_UNICODE_IDENT_VERSION  := 1.0.12
RUST_CRATE_PASTE            := paste-$(RUST_PASTE_VERSION)
RUST_CRATE_RUSTC_HASH       := rustc-hash-$(RUST_RUSTC_HASH_VERSION)
RUST_CRATE_SYN              := syn-$(RUST_SYN_VERSION)
RUST_CRATE_QUOTE            := quote-$(RUST_QUOTE_VERSION)
RUST_CRATE_PROC_MACRO2      := proc-macro2-$(RUST_PROC_MACRO2_VERSION)
RUST_CRATE_UNICODE_IDENT    := unicode-ident-$(RUST_UNICODE_IDENT_VERSION)
# What a program's Cargo.lock has to be moved to before the store's crates
# take effect: cargo only uses a [patch] entry whose version is the locked
# one, so a program's fetch step (%rust_cargo_fetch) pins these first.
# "<name>@<locked version prefix>:<store version>".
RUST_CRATES_LOCK := libc@0.2:$(RUST_LIBC_VERSION) getrandom@0.2:$(RUST_GETRANDOM02_VERSION) \
    getrandom@0.3:$(RUST_GETRANDOM03_VERSION) \
    getrandom@0.4:$(RUST_GETRANDOM04_VERSION) parking_lot_core@0.9:$(RUST_PARKING_LOT_CORE_VERSION)

# Separate source-store directories keep native and legacy patch identities
# from colliding when a build is reconfigured between compiler profiles.
RUST_LIBC_PATCH := $(RUST_CRATE_LIBC)-aros$(if $(filter yes,$(RUST_OFFICIAL)),-native).diff
