LLVM_RELEASE  :=
LLVM_REPO     :=$(LLVM_RELEASE)

ifeq ($(TARGET_LLVM_VER),)
    LLVM_VERSION:=11.0.0
else
    LLVM_VERSION:=$(TARGET_LLVM_VER)
endif

LLVM_VERSION_MAJOR = $(shell echo "$(LLVM_VERSION)" | cut -d"." -f1)

# for version <= 9 of llvm, clang was named "cfe"
ifeq ($(shell test $(LLVM_VERSION_MAJOR) -gt 9; echo $$?),0)
CLANG_NAME    :=clang
else
CLANG_NAME    :=cfe
endif

# for version >= 20 of llvm, we need additional build files
ifeq ($(shell test $(LLVM_VERSION_MAJOR) -gt 19; echo $$?),0)
LLVM_CMAKE_FILES=yes
LLVM_RUNTIMES_FILES=yes
LLLVM_EXTRA_DEPS += tools-crosstools-libunwind-setup
endif

# from version 22 of llvm, upstream no longer publishes the individual
# component archives - only the llvm-project monorepo tarball is released,
# so everything is fetched and patched from that single source instead.
ifeq ($(shell test $(LLVM_VERSION_MAJOR) -gt 21; echo $$?),0)
LLVM_MONOREPO=yes
endif

# Directories the llvm build expects to find beside llvm/ in the source tree.
# 23 needs two more than earlier releases:
#   libc         - shared header-only utilities that libc++ links against via
#                  FindLibcCommonUtils; llvm/CMakeLists.txt aborts without it.
#   third-party  - vendored siphash, included by llvm/lib/Support/SipHash.cpp.
# Neither is built. AROS keeps its own C library - none of this makes it use
# llvm's libc. 20 and 21 reference neither (verified); 22 is untested here.
ifeq ($(shell test $(LLVM_VERSION_MAJOR) -gt 22; echo $$?),0)
LLVM_MONOTREE_SIBLINGS := libc third-party runtimes
endif

# The runtimes cmake modules are used in place from the monorepo for the
# umbrella build, so the copy into the monotree is not needed - the empty
# spelling routes crosstools-llvm-runtimes-<X>-setup at the existing no-op.
# TARGET_LLVM_RUNTIMES_STYLE is set by configure into target.cfg, because
# metamake cannot see anything defined in this file.
ifeq ($(TARGET_LLVM_RUNTIMES_STYLE),umbrella)
LLVM_RUNTIMES_FILES :=
endif
