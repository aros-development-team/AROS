name: Report source line endings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-line-ending-report:
    name: Report C/H line-ending issues
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check C/H line endings
        shell: python
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          import os
          import pathlib
          import subprocess

          zero = "0" * 40
          base = (
              os.environ.get("PULL_REQUEST_BASE_SHA")
              or os.environ.get("PUSH_BEFORE_SHA")
              or ""
          )
          head = os.environ["HEAD_SHA"]

          # A force-push can leave "before" outside the fetched history
          # or make it unrelated to the new branch history.
          available = bool(base) and base != zero and subprocess.run(
              ["git", "cat-file", "-e", f"{base}^{{commit}}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0
          if not available or subprocess.run(
              ["git", "merge-base", "--is-ancestor", base, head],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode != 0:
              base = ""
              default_branch = os.environ.get("DEFAULT_BRANCH", "")
              if default_branch:
                  try:
                      common = subprocess.check_output(
                          ["git", "merge-base", head, f"origin/{default_branch}"],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      ).strip()
                      if common != head:
                          base = common
                  except subprocess.CalledProcessError:
                      pass
              if not base:
                  # With no trustworthy range, inspect only the tip commit.
                  try:
                      base = subprocess.check_output(
                          ["git", "rev-parse", "--verify", f"{head}^1"],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      ).strip()
                  except subprocess.CalledProcessError:
                      pass

          if base:
              raw_paths = subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "-z",
                      "--diff-filter=ACMR",
                      base,
                      head,
                      "--",
                      "*.c",
                      "*.h",
                  ]
              )
          else:
              # A root commit has no parent to compare with.
              raw_paths = subprocess.check_output(
                  [
                      "git",
                      "diff-tree",
                      "--root",
                      "--no-commit-id",
                      "--name-only",
                      "-z",
                      "--diff-filter=ACMR",
                      "-r",
                      head,
                      "--",
                      "*.c",
                      "*.h",
                  ]
              )

          paths = [
              os.fsdecode(path)
              for path in raw_paths.split(b"\0")
              if path
          ]

          def escape_command_value(value):
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          def escape_command_property(value):
              return (
                  escape_command_value(value)
                  .replace(":", "%3A")
                  .replace(",", "%2C")
              )

          findings = 0

          for path in paths:
              source = pathlib.Path(path)

              # Never follow a source-named symlink into the runner filesystem.
              if source.is_symlink() or not source.is_file():
                  continue

              data = source.read_bytes()
              crlf = data.count(b"\r\n")
              bare_cr = data.replace(b"\r\n", b"").count(b"\r")

              if not crlf and not bare_cr:
                  continue

              findings += 1
              details = []
              if crlf:
                  details.append(f"{crlf} CRLF sequence(s)")
              if bare_cr:
                  details.append(f"{bare_cr} bare CR byte(s)")

              message = (
                  f"{path} contains {', '.join(details)}; "
                  "CONTRIBUTING.md asks for Unix (LF) line endings. "
                  "This check is advisory and does not modify the file."
              )

              print(
                  "::warning "
                  f"file={escape_command_property(path)},"
                  "title=C/H line endings"
                  f"::{escape_command_value(message)}"
              )

          print(
              f"Checked {len(paths)} changed C/H file(s); "
              f"reported {findings} line-ending issue(s)."
          )
